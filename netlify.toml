[build]
  command = "npm --prefix frontend run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[dev]
  command = "npm --prefix frontend run dev -- --host 0.0.0.0 --port 5173"
  targetPort = 5173
  publish = "frontend/dist"
  framework = "#custom"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/catchall-memo"
  to = "/.netlify/functions/catchall-memo"
  status = 200

[[redirects]]
  from = "/api/memos/*"
  to = "/.netlify/functions/memos/:splat"
  status = 200

[[redirects]]
  from = "/api/memos"
  to = "/.netlify/functions/memos"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
